
name: Translate README

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Remove old translations so they regenerate
      - name: Prepare languages folder
        run: |
          rm -rf languages
          mkdir -p languages

      # Generate French translation
      - name: Generate French README
        uses: ikhsan3adi/markdown-translator@v3
        with:
          LANG: fr
          FILES: README.md

      # Generate Russian translation
      - name: Generate Russian README
        uses: ikhsan3adi/markdown-translator@v3
        with:
          LANG: ru
          FILES: README.md

      # Generate Spanish translation
      - name: Generate Spanish README
        uses: ikhsan3adi/markdown-translator@v3
        with:
          LANG: es
          FILES: README.md

      # Move translated READMEs into languages folder
      - name: Move translated READMEs
        run: |
          mv -f README.fr.md languages/README.fr.md
          mv -f README.ru.md languages/README.ru.md
          mv -f README.es.md languages/README.es.md

      # Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Commit and push translations
      - name: Commit and push changes
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update translated READMEs"
            git push
          else
            echo "No translation changes to commit."
          fi
